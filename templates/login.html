{% extends 'base.html' %}

{% block title %}Sign In | Fake Profile Detection System{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-5 col-lg-4">
    <div class="cyber-card p-4">
      <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h4 class="text-white fw-bold">Analyst Authentication</h4>
        <p class="text-muted small">Sign in to access forensic detection tools</p>
      </div>

      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label text-muted small fw-semibold">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-end-0 text-muted" style="border-color: var(--cyber-border);"><i class="bi bi-person"></i></span>
            <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label text-muted small fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-end-0 text-muted" style="border-color: var(--cyber-border);"><i class="bi bi-key"></i></span>
            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-cyber-primary w-100 py-2.5 mb-3">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
        </button>

        <div class="text-center">
          <span class="text-muted small">New analyst?</span>
          <a href="{% url 'register' %}" class="small text-info fw-semibold ms-1 text-decoration-none">Register Account</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
